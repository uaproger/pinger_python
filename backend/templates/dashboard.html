<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1>{{ title }}</h1>
    <table class="table table-dark table-striped mt-4">
        <thead>
        <tr>
            <th>Назва</th>
            <th>URL</th>
            <th>Статус-код</th>
            <th>Остання перевірка</th>
        </tr>
        </thead>
        <tbody>
        {% for service in services %}
            <tr>
                <td>{{ service.name }}</td>
                <td>{{ service.url }}</td>
                <td>
                    <span class="badge {% if service.status_code == 200 %}bg-success{% else %}bg-danger{% endif %}">
                        {{ service.status_code|default:"Немає даних" }}
                    </span>
                </td>
                <td>{{ service.last_check|date:"H:i:s d.m.Y" }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
